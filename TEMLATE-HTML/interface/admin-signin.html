  <section class="section-content" style="margin: 100px 0;"> 
    <div class="card mx-auto" style="max-width: 380px">
      <div class="card-body">
        <h4 class="card-title mb-4">Đăng nhập Admin</h4>
        <form id="loginForm">
          <div class="mb-3">
            <input id="username" value="tuananh" name="username" class="form-control" placeholder="Tên đăng nhập"
              type="text" autocomplete="off">
          </div>
          <div class="mb-3">
            <input id="password" value="123456" name="password" class="form-control" placeholder="Mật khẩu"
              type="password" autocomplete="off">
          </div>
          <button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
        </form>
      </div> 
    </div> 
  </section>

  <script src="https://cdn.jsdelivr.net/npm/jwt-decode/build/jwt-decode.min.js"></script>
<Script>
  document.getElementById("loginForm").addEventListener("submit", async function (e) {
      e.preventDefault(); // Ngăn reload trang mặc định

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      try {
        const response = await fetch("http://localhost:8080/api/auth/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            username: username,
            password: password
          })
        });

        const result = await response.json();

        if (response.ok && result.result.success == true) {
          alert("Đăng nhập thành công!");
          const token = result.result.token;
          const decoded = jwt_decode(token);
          console.log(decoded);
          localStorage.setItem("token", token);
          localStorage.setItem("username", decoded.sub);
          console.log(result.result.role);
          // // lưu token hoặc username vào localStorage
          localStorage.setItem("role", result.result.role);
          localStorage.setItem("loginTime", Date.now());
          console.log(result);
          window.location.href = "/admin.html";
        } else {
          console.log(result.result.success)
          alert(result.message || "Đăng nhập thất bại");
        }
      } catch (error) {
        console.error("Lỗi:", error);
        alert("Có lỗi khi kết nối server!");
      }
    });
</Script>
