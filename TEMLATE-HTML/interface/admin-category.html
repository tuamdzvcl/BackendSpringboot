    <script src="./js/auth.js"></script>
    <script>

        initAuth();
        const categoryList = document.getElementById("category_list");
        let currentPage = 1;
        const pageSize = 5; // số record/1 trang
        async function loadCategory() {
            try {
                const token = localStorage.getItem("token");
                if (!token) {
                    alert("Chưa đăng nhập!");
                    window.location.href = "/admin-signin.html";
                    return;
                }

                const res = await fetch("http://localhost:8080/api/category", {
                    method: "GET",
                    headers: {
                        "Authorization": "Bearer " + token,
                        "Content-Type": "application/json"
                    }
                });

                if (!res.ok) {
                    if (res.status === 401) {
                        alert("Token hết hạn hoặc không hợp lệ. Vui lòng đăng nhập lại!");
                        window.location.href = "./admin-signin.html";
                        return;
                    }
                    throw new Error("HTTP status " + res.status);
                }
                const data = await res.json();

                console.log(data); // xem cấu trúc trả về trong console

                // lấy mảng user đúng chỗ
                const categorys = data.result // nếu API trả về thẳng mảng thì đổi thành: const users = data;

                // tạo chuỗi HTML bằng forEach
                let html = "";
                categorys.forEach(item => {
                    html += `
          <tr>
            <th scope="row">${item.id}</th>
            <td>${item.name}</td>
            <td>${item.description}</td>
            <td><img src="./img/${item.imageName}"></td>
            <td class="text-center text-nowrap">
              <a class="btn btn-primary me-2" href="./admin-category-details.html?id=${item.id}&&mode=view" type="button">Xem</a>
              <a class="btn btn-success me-2" href="./admin-category-details.html?id=${item.id}"&&mode=edit" type="button">Sửa</a>
              <a class="btn btn-danger delete-btn" data-id="${item.id}">Xóa</a>
            </td>
          </tr>
        `;
                });
                // gán vào tbody
                categoryList.innerHTML = html;

            } catch (err) {
                console.error("Lỗi khi load category:", err);
            }
            document.querySelectorAll(".delete-btn").forEach(btn => {
                btn.addEventListener("click", async () => {
                    const id = btn.getAttribute("data-id");

                    console.log("Xóa user với ID:", id);
                    if (!confirm("Bạn có chắc chắn muốn xóa category này không?")) {
                        return;
                    }

                    try {
                        const token = localStorage.getItem("token");
                        if (!token) {
                            alert("Chưa đăng nhập!");
                            window.location.href = "./admin-signin.html";
                            return;
                        }
                        const res = await fetch(`http://localhost:8080/api/category/${id}`, {
                            method: "DELETE",
                            headers: {
                                "Authorization": "Bearer " + token,
                                "Content-Type": "application/json"
                            }
                        });

                        if (res.ok) {
                            alert("Xóa user thành công!");
                            loadCategory(); // gọi lại loadCategory để refresh danh sách
                        } else {
                            const errorData = await res.json();
                            alert("Lỗi khi xóa user: " + (errorData.message || res.status));
                        }
                    } catch (err) {
                        console.error("Lỗi:", err);
                        alert("Không thể kết nối server!");
                    }
                });
            });
        }
        loadCategory();
    </script>
