<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Admin: Thêm sản phẩm</title>

    <link href="img/favicon.ico" rel="shortcut icon" type="image/x-icon">

    <!-- Bootstrap v5.0.1 -->
    <link href="css/bootstrap.css" type="text/css" rel="stylesheet">
    <script src="js/bootstrap.bundle.js" type="text/javascript"></script>

    <!-- Bootstrap Icons v1.5.0 -->
    <link href="css/bootstrap-icons.css" type="text/css" rel="stylesheet">

    <!-- Custom Styles -->
    <link href="css/styles.css" type="text/css" rel="stylesheet">
</head>

<body>

  <div id="header"></div>
    <section class="section-content">
        <div class="container">
            <header class="section-heading py-4 d-flex justify-content-between">
                <h3 class="section-title" id="title">Thêm user</h3>
            </header> <!-- section-heading.// -->
            <main class="add-book-form mb-5">
                <form id="add-user-form" class="w-50">
                    <div class="mb-3" id="usernameGroup">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username">
                    </div>
                    <div class=" mb-3" id="passwordGroup">
                        <label for="password" class="form-label">Mật khẩu</label>
                        <input type="password" class="form-control" id="password">
                    </div>
                    <div class="mb-3">
                        <label for="fullname" class="form-label">Họ và Tên</label>
                        <input type="text" class="form-control" id="fullname">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email">
                    </div>
                    <div class="mb-3">
                        <label for="address" class="form-label">Địa chỉ</label>
                        <input type="text" class="form-control" id="address">
                    </div>
                    <div class="mb-3">
                        <label for="phone" class="form-label">Số điện thoại</label>
                        <input type="number" class="form-control" id="phone">
                    </div>
                    <div class="mb-3">
                        <label for="gender" class="form-label">Giới tính</label>
                        <select class="form-control" id="gender">
                            <option value="true">Nam</option>
                            <option value="false">Nữ</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="role" class="form-label">Chức vụ</label>
                        <select class="form-control" id="roleSelect">
                            <option value="ADMIN">ADMIN</option>
                            <option value="USER">USER</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary" id="submitBtn">Thêm User</button>
                    <button type="reset" class="btn btn-warning ms-2" id="resetBtn">Tẩy trống</button>
                    <button type="button" class="btn btn-light ms-2" id="cancelBtn">Hủy</button>
                </form>
            </main> <!-- add-book-form.// -->
        </div> <!-- container.// -->
    </section> <!-- section-content.// -->

    <div id="footer"></div> <!-- section-footer.// -->
    <script src="./common/js/header.js"></script>
    <script src="./common/js/foor.js" ></script>
    <script src="./js/auth.js"></script>
    <script>
        initAuth();
      
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");
        const mode = params.get("mode");
        const submitBtn = document.getElementById("submitBtn");
        const resetBtn = document.getElementById("resetBtn");
        const passwordGroup = document.getElementById("passwordGroup");
        const usernameGroup = document.getElementById("usernameGroup");
        const title = document.getElementById("title");
      
        // ---- Hàm load user ----
        async function loadUser() {
          if (!id) return;
          try {
            const token = localStorage.getItem("token");
            if (!token) {
              alert("Chưa đăng nhập!");
              window.location.href = "/admin-signin.html";
              return;
            }
      
            const res = await fetch(`http://localhost:8080/api/users/${id}`, {
              method: "GET",
              headers: {
                "Authorization": "Bearer " + token,
                "Content-Type": "application/json"
              }
            });
      
            if (!res.ok) {
              throw new Error("Không lấy được user");
            }
      
            const data = await res.json();
            const user = data.result;
      
            // Gán dữ liệu vào form
            document.getElementById("username").value = user.username || "";
            // không trả password thì ẩn trường password
            document.getElementById("password").style.display = "none";
            document.getElementById("fullname").value = user.fullname || "";
            document.getElementById("email").value = user.email || "";
            document.getElementById("address").value = user.address || "";
            document.getElementById("phone").value = user.phone || "";
            document.getElementById("gender").value = user.gender ? "true" : "false";
            document.getElementById("roleSelect").value = user.role || "USER";
      
            if (mode === "view") {
              submitBtn.style.display = "none";
              resetBtn.style.display = "none";
              passwordGroup.style.display = "none";
              title.textContent = "Xem thông tin user";
              document
                .querySelectorAll("#add-user-form input, #add-user-form select")
                .forEach(el => (el.disabled = true));
            } else {
              // edit mode
              document.getElementById("password").style.display = "block";
              document.getElementById("password").value = "";
              title.textContent = "Cập nhật user";
              submitBtn.textContent = "Cập nhật User";
              usernameGroup.style.display = "none";
              document.getElementById("roleSelect").disabled = true;
            }
          } catch (err) {
            console.error("Lỗi khi load user:", err);
            alert("Không thể tải user!");
          }
        }
      
        // ---- Gọi hàm load user nếu có id ----
        loadUser();
      
        // ---- Submit form ----
        document.getElementById("add-user-form").addEventListener("submit", async function (e) {
          e.preventDefault();
          const user = {
            username: document.getElementById("username").value,
            password: document.getElementById("password").value,
            fullname: document.getElementById("fullname").value,
            email: document.getElementById("email").value,
            address: document.getElementById("address").value,
            phone: document.getElementById("phone").value,
            gender: document.getElementById("gender").value === "true",
            role: document.getElementById("roleSelect").value
          };
          console.log("User gửi đi:", user);
      
          try {
            const token = localStorage.getItem("token");
            let res;
            if (id) {
              // update
              res = await fetch(`http://localhost:8080/api/users/${id}`, {
                method: "PUT",
                headers: {
                  "Authorization": "Bearer " + token,
                  "Content-Type": "application/json"
                },
                body: JSON.stringify(user)
              });
            } else {
              // create
              res = await fetch("http://localhost:8080/api/users", {
                method: "POST",
                headers: {
                  "Authorization": "Bearer " + token,
                  "Content-Type": "application/json"
                },
                body: JSON.stringify(user)
              });
            }
      
            if (res.ok) {
              alert(id ? "Cập nhật user thành công!" : "Thêm user thành công!");
              window.location.href = "./admin-user.html";
            } else {
              const errorData = await res.json();
              alert("Lỗi: " + (errorData.message || res.status));
            }
          } catch (err) {
            console.error("Lỗi:", err);
            alert("Không thể kết nối server!");
          }
        });
      
        // ---- Cancel ----
        document.getElementById("cancelBtn").addEventListener("click", () => {
          window.location.href = "./admin-user.html";
        });
      </script>
      
</body>

</html>
