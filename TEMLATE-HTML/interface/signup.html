<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <title>Đăng ký</title>

  <link href="img/favicon.ico" rel="shortcut icon" type="image/x-icon">

  <!-- Bootstrap v5.0.1 -->
  <link href="css/bootstrap.css" type="text/css" rel="stylesheet">
  <script src="js/bootstrap.bundle.js" type="text/javascript"></script>

  <!-- Bootstrap Icons v1.5.0 -->
  <link href="css/bootstrap-icons.css" type="text/css" rel="stylesheet">

  <!-- Custom Styles -->
  <link href="css/styles.css" type="text/css" rel="stylesheet">
</head>

<body>
  <section class="section-content" style="margin: 100px 0;">
    <div class="card mx-auto" style="max-width: 380px">
      <div class="card-body">
        <h4 class="card-title mb-4">Đăng ký</h4>
        <form id="form">
          <div class="mb-3">
            <label for="inputUsername" class="form-label">Tên đăng nhập</label>
            <input type="text" class="form-control" id="inputUsername" value="tuananh">
          </div>
          <div class="mb-3">
            <label for="inputName" class="form-label">Họ tên</label>
            <input type="text" class="form-control" id="inputName" value="Phạm Ngọc Tuấn Anh">
          </div>
          <div class="mb-3">
            <label for="inputEmail" class="form-label" >Email</label>
            <input type="email" class="form-control" id="inputEmail" value="phamngoctuananh@gmail.com">
          </div>
          <div class="mb-3">
            <label for="inputPhoneNumber" class="form-label" >Số điện thoại</label>
            <input type="number" class="form-control" id="inputPhoneNumber" value = "0964516124">
          </div>
          <div class="mb-3">
            <div class="form-check d-inline-block me-4">
              <input class="form-check-input" type="radio" name="radioGender" id="radioGender1" checked>
              <label class="form-check-label" for="radioGender1">Nam</label>
            </div>
            <div class="form-check d-inline-block">
              <input class="form-check-input" type="radio" name="radioGender" id="radioGender2">
              <label class="form-check-label" for="radioGender2">Nữ</label>
            </div>
          </div>
          <div class="mb-3">
            <label for="inputAddress" class="form-label">Địa chỉ</label>
            <input type="text" class="form-control" id="inputAddress" value="Ha noi">
          </div>
          <div class="mb-3">
            <label for="inputPassword" class="form-label">Mật khẩu</label>
            <input type="password" class="form-control" id="inputPassword" value="123456">
          </div>
          <div class="mb-3 form-check">
            <input class="form-check-input" type="checkbox" value="" id="checkboxPolicy" checked>
            <label class="form-check-label" for="checkboxPolicy">Đồng ý với <a href="#">điều khoản sử
                dụng</a></label>
          </div>
          <button type="submit" class="btn btn-primary w-100">Đăng ký</button>
        </form>
      </div> <!-- card-body.// -->
    </div> <!-- card.// -->
    <p class="text-center mt-4">Đã có tài khoản? <a href="#">Đăng nhập</a></p>
  </section> <!-- section-content.// -->

  <script>
    document.getElementById("form").addEventListener("submit", async function (e) {
      e.preventDefault();
  
      // Lấy dữ liệu từ form
      const username = document.getElementById("inputUsername").value;
      const fullname = document.getElementById("inputName").value;
      const email = document.getElementById("inputEmail").value;
      const phone = document.getElementById("inputPhoneNumber").value;
      const gender = document.getElementById("radioGender1").checked; // Nam = true, Nữ = false
      const address = document.getElementById("inputAddress").value;
      const password = document.getElementById("inputPassword").value;
  
      // Call API
      try {
        const response = await fetch("http://localhost:8080/api/users", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            username: username,
            fullname: fullname,
            email: email,
            phone: phone,
            gender: gender,
            address: address,
            password: password
          })
        });
  
        const result = await response.json();
  
        if (response.ok && result.code==200) {
          console.log(result);

          alert("Đăng ký thành công!");
          // Chuyển về trang đăng nhập
          window.location.href = "/signin.html";
        } else {
          alert(result.message || "Đăng ký thất bại!");
        }
      } catch (error) {
        console.error("Lỗi:", error);
        alert("Không thể kết nối server!");
      }
    });
  </script>
</body>

</html>
